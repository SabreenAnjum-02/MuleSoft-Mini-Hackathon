<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Luxury Fashion Boutique</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top, #1a1a24, #0d0d12);
            color: #f3f3f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            padding: 45px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            letter-spacing: 4px;
            color: #d4af37;
            text-transform: uppercase;
        }

        .brand p {
            font-size: 12px;
            color: #a0a0b0;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #d0d0d8;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        select option {
            background: #1a1a24;
            color: #fff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .discount-badge {
            background: rgba(212, 175, 55, 0.15);
            border: 1px dashed #d4af37;
            color: #d4af37;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            border: none;
            border-radius: 10px;
            color: #000000;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            line-height: 1.6;
        }

        .success {
            background: rgba(46, 213, 115, 0.15);
            border: 1px solid rgba(46, 213, 115, 0.4);
            color: #2ed573;
        }

        .error {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.4);
            color: #ff4757;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">
            <h1>Aura</h1>
            <p>Haute Couture & Fine Jewelry</p>
        </div>

        <div class="discount-badge">
            ✨ 10% VIP Discount automatically applied on orders above ₹10,000!
        </div>

        <div class="form-group">
            <label for="customerId">Customer ID</label>
            <input type="text" id="customerId" value="CUST001">
        </div>

        <div class="form-group">
            <label for="productId">Select Luxury Item</label>
            <select id="productId">
                <option value="PROD123">Italian Silk Tuxedo (₹45,000)</option>
                <option value="PROD789">Swiss Chronograph Watch (₹1,20,000)</option>
                <option value="PROD101">Designer Leather Handbag (₹65,000)</option>
                <option value="PROD456">Luxury Leather Belt (₹800 - Low Stock)</option>
                <option value="PROD999">Custom Item (Test Not Found Error)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" value="1" min="1">
        </div>

        <button onclick="placeOrder()">Place Luxury Order</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function placeOrder() {
            const customerId = document.getElementById('customerId').value;
            const productId = document.getElementById('productId').value;
            const quantity = parseInt(document.getElementById('quantity').value);
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.innerHTML = '✨ Processing order through MuleSoft API...';

            try {
                const response = await fetch('http://localhost:8081/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customerId: customerId,
                        productId: productId,
                        quantity: quantity
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.success) {
                    const details = data.orderDetails;
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <strong>🎉 Order Confirmed!</strong><br>
                        <strong>Order ID:</strong> ${details.orderId}<br>
                        <strong>Item:</strong> ${details.productName || details.productId}<br>
                        <strong>Subtotal:</strong> ₹${details.subtotal.toLocaleString()}<br>
                        <strong>Discount (10%):</strong> -₹${details.discount.toLocaleString()}<br>
                        <strong>Final Amount:</strong> ₹${details.totalAmount.toLocaleString()}
                    `;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `<strong>❌ Order Failed:</strong> ${data.message || 'Unknown error'}`;
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '<strong>❌ Connection Error:</strong> Make sure your Mule Application is running on port 8081!';
                console.error(error);
            }
        }
    </script>
</body>
</html>
